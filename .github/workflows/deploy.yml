name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  HUGO_VERSION: 0.169.0

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: pages
        uses: actions/configure-pages@v5
      - name: Install Hugo
        run: |
          tarball="hugo_${HUGO_VERSION}_linux-amd64.tar.gz"
          base="https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}"
          curl -fsSLO "${base}/${tarball}"
          curl -fsSL "${base}/hugo_${HUGO_VERSION}_checksums.txt" | grep " ${tarball}\$" | sha256sum -c -
          tar -xzf "${tarball}" -C "${RUNNER_TEMP}" hugo
      - name: Build
        run: '"${RUNNER_TEMP}/hugo" --minify --baseURL "${{ steps.pages.outputs.base_url }}/"'
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
