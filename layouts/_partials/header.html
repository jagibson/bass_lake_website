<header class="site-header">
  <div class="wrap">
    <a class="brand" href="{{ site.Home.RelPermalink }}">
      {{- if .IsHome -}}
      <span class="brand-text">{{ site.Title }}</span>
      {{- else -}}
      <img src="{{ "images/logo-wordmark.png" | relURL }}" width="320" height="136" alt="{{ site.Title }}: home">
      {{- end -}}
    </a>
    <nav aria-label="Main">
      <ul>
        {{- range site.Menus.main }}
        <li><a href="{{ .URL }}"{{ if $.IsMenuCurrent .Menu . }} aria-current="page"{{ end }}>{{ .Name }}</a></li>
        {{- end }}
      </ul>
    </nav>
  </div>
</header>
